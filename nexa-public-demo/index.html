<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b1930"><title>NEXA Studio | 開発デモギャラリー</title><style>
:root{color-scheme:light;--navy:#0b1930;--ink:#1a2941;--muted:#65748a;--accent:#6b5de7;--line:#e3e8f0;--soft:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:var(--soft);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;color:var(--ink)}button{font:inherit;cursor:pointer}a{text-decoration:none}header{background:radial-gradient(circle at 85% 0%,#293e68 0%,transparent 45%),linear-gradient(110deg,#081426,#162743);color:white;padding:24px max(20px,calc((100vw - 1180px)/2)) 100px}.brand{font-size:23px;font-weight:850;letter-spacing:.01em}.brand b{color:#aaa0ff}.kicker{display:inline-flex;border:1px solid #8192ad;border-radius:100px;padding:6px 12px;font-size:12px;letter-spacing:.06em;margin-top:35px;color:#d8e0ef}.hero{font-size:clamp(29px,5vw,52px);letter-spacing:-.035em;line-height:1.28;margin:16px 0}.lead{font-size:15px;color:#d2dbea;line-height:1.9;max-width:670px}.wrap{max-width:1200px;margin:-67px auto 60px;padding:0 18px}.chooser{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.choice{text-align:left;border:1px solid #dfe5ee;border-radius:23px;padding:23px;background:white;box-shadow:0 12px 28px #101c3012;transition:.2s;position:relative;min-height:156px}.choice.selected{border:2px solid var(--accent);padding:22px;box-shadow:0 15px 36px #635de32d}.choice:focus-visible,.open:focus-visible{outline:3px solid #8e81fb;outline-offset:3px}.choice .mark{display:inline-block;color:#4c41a5;background:#eeebff;border-radius:40px;padding:5px 10px;font-weight:750;font-size:12px;margin-bottom:10px}.choice h2{margin:0 0 6px;font-size:23px}.choice p{margin:0;font-size:13px;color:#66768d;line-height:1.6}.choice.selected:after{content:'選択中';position:absolute;top:20px;right:20px;font-size:12px;font-weight:800;color:#5a4fd1}.screen{background:white;border:1px solid var(--line);border-radius:22px;margin-top:18px;overflow:hidden;box-shadow:0 18px 40px #14243b13}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:15px 21px;border-bottom:1px solid var(--line)}.toolbar strong{font-size:16px}.toolbar small{display:block;color:#718096;margin-top:3px}.actions{display:flex;gap:8px;align-items:center}.open{border:1px solid #d5dbeb;background:white;color:#263657;border-radius:10px;font-weight:700;padding:10px 14px;font-size:13px}.open.primary{background:#29225f;color:#fff;border-color:#29225f}iframe{display:block;width:100%;height:1030px;border:0;background:#f6f7f9}.foot{color:#708095;font-size:12px;margin:20px 3px 0;line-height:1.8}.indicator{display:inline-block;height:8px;width:8px;background:#20aa80;border-radius:100%;margin-right:6px}@media(max-width:650px){header{padding:19px 20px 96px}.kicker{margin-top:30px}.chooser{grid-template-columns:1fr;gap:10px}.choice{min-height:unset;padding:18px}.choice.selected{padding:17px}.choice h2{font-size:19px}.toolbar{padding:13px}.actions{width:100%}.open{flex:1;text-align:center}iframe{height:1120px}.wrap{padding:0 12px}}
</style></head><body><header><div class="brand"><b>◢</b> NEXA Studio</div><span class="kicker">INTERACTIVE DEMO COLLECTION</span><h1 class="hero">アイデアを、<br>使える仕組みに。</h1><p class="lead">アンケート・予約受付・モバイルオーダー。<br>店舗向け業務改善を体験できる2種類のデモを、ひとつの場所にまとめました。</p></header><main class="wrap"><div class="chooser" role="group" aria-label="デモのバージョンを選ぶ"><button id="originalBtn" class="choice" type="button" aria-pressed="false" onclick="switchDemo('original')"><span class="mark">ORIGINAL</span><h2>オリジナル版</h2><p>最初のデザインをそのまま収録。シンプルで落ち着いた操作体験。</p></button><button id="upgradeBtn" class="choice selected" type="button" aria-pressed="true" onclick="switchDemo('upgrade')"><span class="mark">UPGRADED</span><h2>アップグレード版</h2><p>スマホ表示・操作のわかりやすさ・管理機能・提案内容を強化。</p></button></div><section class="screen" aria-label="操作デモ"><div class="toolbar"><div><strong id="currentTitle"><span class="indicator"></span>アップグレード版を体験</strong><small>各画面でアンケート・予約・注文を操作できます（課金・通知は発生しません）。</small></div><div class="actions"><button class="open" onclick="reloadDemo()" type="button">↻ デモを初期化</button><a class="open primary" id="fullLink" href="upgraded.html" target="_blank" rel="noopener">別画面で開く ↗</a></div></div><iframe id="demoFrame" title="NEXA Studio操作デモ" loading="eager" src="upgraded.html"></iframe></section><p class="foot">※営業用の体験デモです。実際の予約登録・決済・通知・サーバーへの注文送信は行われません。<br>オリジナル版とアップグレード版は独立して動作し、相互にデータを引き継ぎません。</p></main><script>let active='upgrade';function switchDemo(x){active=x;const old=x==='original';const frame=document.getElementById('demoFrame');frame.src=old?'original.html':'upgraded.html';document.getElementById('currentTitle').innerHTML='<span class="indicator"></span>'+(old?'オリジナル版':'アップグレード版')+'を体験';document.getElementById('fullLink').href=old?'original.html':'upgraded.html';for(const [id,on] of [['originalBtn',old],['upgradeBtn',!old]]){const e=document.getElementById(id);e.classList.toggle('selected',on);e.setAttribute('aria-pressed',String(on))}}function reloadDemo(){document.getElementById('demoFrame').contentWindow.location.reload()}</script></body></html>

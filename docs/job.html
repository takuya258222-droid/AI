<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>お仕事のご案内</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #f5f7fa;
  --surface: #ffffff;
  --fg: #1a1a2e;
  --fg2: #555;
  --accent: #2563eb;
  --accent-light: #eff6ff;
  --kaigo: #059669;
  --kaigo-bg: #ecfdf5;
  --kango: #7c3aed;
  --kango-bg: #f5f3ff;
  --border: #e5e7eb;
  --radius: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0 }
body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--fg);
  min-height: 100vh;
  padding: 0 0 40px;
  -webkit-font-smoothing: antialiased;
}
.hero {
  background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
  color: #fff;
  padding: 40px 20px 32px;
  text-align: center;
}
.hero h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px }
.hero p { font-size: 14px; opacity: 0.9 }
.container { max-width: 500px; margin: 0 auto; padding: 0 16px }
.cards { margin-top: -20px; display: flex; flex-direction: column; gap: 14px }
.card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  border-left: 4px solid var(--accent);
  position: relative;
}
.card.kaigo { border-left-color: var(--kaigo) }
.card.kango { border-left-color: var(--kango) }
.card-num {
  position: absolute; top: -10px; left: -10px;
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--accent); color: #fff;
  font-size: 14px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 6px rgba(37,99,235,0.3);
}
.card.kaigo .card-num { background: var(--kaigo) }
.card.kango .card-num { background: var(--kango) }
.badge {
  display: inline-block; font-size: 11px; font-weight: 700;
  padding: 2px 8px; border-radius: 6px; color: #fff; margin-right: 6px;
}
.badge.kaigo { background: var(--kaigo) }
.badge.kango { background: var(--kango) }
.ft-badge {
  display: inline-block; font-size: 11px; font-weight: 600;
  padding: 2px 8px; border-radius: 6px;
  background: #f3f4f6; color: #555;
}
.card-name { font-size: 18px; font-weight: 700; margin: 8px 0 6px; line-height: 1.4 }
.card-addr { font-size: 14px; color: var(--fg2); margin-bottom: 10px }
.card-addr::before { content: '\1F4CD '; font-size: 13px }
.info-row {
  display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px;
}
.info-tag {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 13px; font-weight: 600;
  padding: 4px 10px; border-radius: 8px;
  background: #fef3c7; color: #92400e;
}
.wage {
  background: var(--accent-light); color: var(--accent);
  font-size: 14px; font-weight: 700;
  padding: 8px 12px; border-radius: 8px;
  margin: 10px 0;
  text-align: center;
}
.interest-btn {
  display: block; width: 100%; padding: 14px;
  border: none; border-radius: 10px;
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: #fff; font-size: 15px; font-weight: 700;
  cursor: pointer; text-align: center;
  margin-top: 12px;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 3px 10px rgba(37,99,235,0.25);
}
.interest-btn:active { transform: scale(0.97) }
.footer-msg {
  text-align: center; padding: 24px 16px; font-size: 13px;
  color: var(--fg2); line-height: 1.8;
}
.footer-msg strong { color: var(--fg); font-weight: 600 }
.empty-msg {
  text-align: center; padding: 60px 20px;
  color: var(--fg2); font-size: 15px;
}
</style>
</head>
<body>

<div class="hero">
  <h1>お仕事のご案内</h1>
  <p>あなたにピッタリの案件をご紹介します</p>
</div>

<div class="container">
  <div class="cards" id="cards"></div>
  <div class="footer-msg" id="footer"></div>
</div>

<script>
(function(){
  function decode(){
    try {
      var hash = location.hash.substring(1);
      if(!hash) return null;
      var json = decodeURIComponent(atob(hash.replace(/-/g,'+').replace(/_/g,'/')));
      return JSON.parse(json);
    } catch(e){ return null; }
  }

  var data = decode();
  var cards = document.getElementById('cards');
  var footer = document.getElementById('footer');

  if(!data || !data.items || !data.items.length){
    cards.innerHTML = '<div class="empty-msg">案件情報を読み込めませんでした。<br>送信元にお問い合わせください。</div>';
    return;
  }

  data.items.forEach(function(r, i){
    var cc = r.cat === '介護' ? 'kaigo' : 'kango';
    var shifts = '';
    if(r.s && r.s.length){
      shifts = '<div class="info-row">' + r.s.map(function(sh){
        return '<span class="info-tag">' + sh + '</span>';
      }).join('') + '</div>';
    }
    var wage = '';
    if(r.cat === '介護') wage = '<div class="wage">時給目安：1,500〜1,800円程度</div>';
    else if(r.cat === '看護') wage = '<div class="wage">時給目安：2,200〜2,450円程度</div>';

    var replyText = '案件' + (i+1) + '「' + r.n + '」が気になります！';

    var html = '<div class="card ' + cc + '">' +
      '<div class="card-num">' + (i+1) + '</div>' +
      '<div><span class="badge ' + cc + '">' + r.cat + '</span>' +
      (r.ft && r.ft !== 'その他' ? '<span class="ft-badge">' + r.ft + '</span>' : '') +
      '</div>' +
      '<div class="card-name">' + r.n + '</div>' +
      '<div class="card-addr">' + r.a + '</div>' +
      shifts + wage +
      '<button class="interest-btn" onclick="copyReply(\'' + replyText.replace(/'/g,"\\'") + '\', this)">この案件が気になる</button>' +
      '</div>';
    cards.innerHTML += html;
  });

  footer.innerHTML = '<strong>※上記はあくまで一例です</strong><br>' +
    'ご希望・ご経験に合わせてご提案可能です！<br>' +
    '気になる案件の番号をご返信ください📩<br><br>' +
    '<strong>※資格・経験により時給は変動します</strong>';
})();

function copyReply(text, btn){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      btn.textContent = 'コピーしました！そのまま返信してください';
      btn.style.background = '#059669';
      setTimeout(function(){ btn.textContent = 'この案件が気になる'; btn.style.background = ''; }, 2500);
    });
  } else {
    var ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = 'コピーしました！そのまま返信してください';
    btn.style.background = '#059669';
    setTimeout(function(){ btn.textContent = 'この案件が気になる'; btn.style.background = ''; }, 2500);
  }
}
</script>
</body>
</html>

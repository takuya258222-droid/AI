name: Daily Data Update

on:
  # 2026-11-24: schedule PAUSED at the user's order, pending source
  # investigation. The Sheets source yields far fewer Kansai records
  # (2,849) than the app's original dataset (6,854), and on 2026-11-22
  # the daily update silently overwrote the page with the small set.
  # Do NOT re-enable this schedule until that discrepancy is resolved.
  # schedule:
  #   - cron: "30 22 * * *"  # 毎日07:30 JST (22:30 UTC)
  workflow_dispatch:  # 手動実行のみ (update_html.py の件数ガードが効く)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/github-check-tezbwr

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (service account mode only)
        if: env.GOOGLE_SERVICE_ACCOUNT_JSON != ''
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: pip install google-api-python-client google-auth

      - name: Fetch Google Sheets data
        env:
          GAS_DEPLOY_URL: ${{ secrets.GAS_DEPLOY_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/fetch_sheets.py /tmp/sheets

      - name: Build app data
        run: python scripts/build_app_data.py /tmp/sheets /tmp/app_data.json

      - name: Update HTML
        # 件数ガード: 差し替えで関西件数が10%超減る場合、update_html.py が
        # exit 1 してこの実行は失敗 (赤) になり、コミットされず、
        # 公開中のページは旧データのまま残る。手動実行でも同じ。
        # 正当な減少で外す場合のみ、この step に env: ALLOW_KANSAI_SHRINK: "1" を追加。
        run: python scripts/update_html.py /tmp/app_data.json docs/index.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          RECORDS=$(python -c "import json; print(len(json.load(open('/tmp/app_data.json'))))")
          DATE=$(TZ=Asia/Tokyo date +%Y/%m/%d)
          git add docs/index.html
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: 日次データ更新 ${DATE}（関西${RECORDS}件）"
          git push

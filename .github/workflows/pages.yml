name: Deploy to GitHub Pages
on:
  push:
    branches: ["claude/jolly-edison-bzgzfi", "claude/github-check-tezbwr"]
    paths: ["docs/**", ".github/kansai_guard.json"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 公開ガード（関西案件の件数・座標が大きく減っていたら公開しない）
        run: python3 scripts/pages_guard.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 成果物の反映待ち
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
